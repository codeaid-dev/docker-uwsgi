<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else "4択クイズ学習システム" }}</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>4択クイズ学習システム</h1>
  <nav>
    <a href="{{ url_for('index') }}">問題一覧</a>
    <a href="{{ url_for('register') }}">問題登録</a>
    <a href="{{ url_for('quiz_start') }}">クイズ開始</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="{{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
<footer>
  <p>4択クイズ学習システム</p>
</footer>
</body>
</html>
