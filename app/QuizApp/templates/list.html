{% extends "base.html" %}

{% block content %}
<h2>問題一覧</h2>
<p>
  <a href="{{ url_for('register') }}" class="button">新しい問題を登録</a>
</p>
{% if questions %}
<table>
  <tr>
    <th>ID</th>
    <th>カテゴリ</th>
    <th>問題文</th>
    <th>操作</th>
  </tr>
  {% for q in questions %}
  <tr>
    <td>{{ q.id }}</td>
    <td>{{ q.category_name }}</td>
    <td>{{ q.question }}</td>
    <td class="actions">
      <a href="{{ url_for('edit', question_id=q.id) }}">編集</a>
      <form method="post"
            action="{{ url_for('delete', question_id=q.id) }}">
        <button type="submit" class="danger">削除</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>登録されている問題はありません。</p>
{% endif %}
{% endblock %}
